name: Release macOS app

# Builds the menu-bar app and publishes Where-to-vibe.zip to a GitHub Release,
# so end users can install with the one-line `curl … releases/latest/download/
# Where-to-vibe.zip` command in the README — no Xcode, no clone, no build.
#
# Trigger either by pushing a version tag (e.g. `git tag v0.1.1 && git push
# origin v0.1.1`) or by running this workflow manually and entering a tag.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.1)"
        required: true
        default: "v0.1.1"

permissions:
  contents: write # needed to create the Release and upload the asset

jobs:
  build-and-release:
    # macos-15 ships Xcode 16.x. The project is in Xcode 16's project format
    # (objectVersion 77), which Xcode 15.4 (the macos-14 default) cannot open.
    runs-on: macos-15
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Select the newest installed Xcode (need 16+ for project format 77)
        run: |
          set -euxo pipefail
          newest=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest/Contents/Developer"; fi
          xcodebuild -version

      - name: Build the app (Release, ad-hoc signed)
        run: |
          set -euxo pipefail
          # Ad-hoc signing ("-") so it builds on CI without an Apple Developer
          # certificate. The app is not notarized; the README install command
          # clears the download quarantine so Gatekeeper still lets it open.
          # ENABLE_HARDENED_RUNTIME=NO: with hardened runtime on, macOS Library
          # Validation refuses to load Sparkle.framework (signed by Sparkle's
          # team) into an ad-hoc app (no team) — "different Team IDs" — and the
          # app crashes on launch. A demo build isn't notarized, so we don't need
          # hardened runtime; turning it off lets the embedded framework load.
          xcodebuild \
            -project macos-app/where-to-vibe.xcodeproj \
            -scheme where-to-vibe \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ENABLE_HARDENED_RUNTIME=NO \
            build

      - name: Re-sign ad-hoc so embedded frameworks match the app's identity
        run: |
          set -euxo pipefail
          APP_PATH="build/Build/Products/Release/Where-to-vibe.app"
          # Force ad-hoc re-sign of the whole bundle (frameworks/XPC included) so
          # everything shares one identity (no Team ID), satisfying the loader.
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Zip the .app
        run: |
          set -euxo pipefail
          APP_PATH="build/Build/Products/Release/Where-to-vibe.app"
          test -d "$APP_PATH"
          # --keepParent so the zip contains "Where-to-vibe.app/…" at the top,
          # matching the README's `unzip -d ~/Applications` + open flow.
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" Where-to-vibe.zip
          ls -lh Where-to-vibe.zip

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          files: Where-to-vibe.zip
          fail_on_unmatched_files: true
          make_latest: true
