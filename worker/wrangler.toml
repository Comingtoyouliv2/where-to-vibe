name = "where-to-vibe"
main = "src/index.ts"
compatibility_date = "2024-09-01"

[vars]
ELEVENLABS_VOICE_ID = "kPzsL2i3teMYv0FxEYQ6"
# Default model for /coach. We tried Haiku 4.5 for speed and the latency
# win was marginal (vision token processing dominates over model size),
# while quality dropped — Haiku frequently missed the chat input field
# and returned mode:"none" on screens where Sonnet correctly coached.
# Sonnet 4.6 is back as the default; Haiku 4.5 stays as the classifier
# since /classify only needs a single-word answer.
COACH_MODEL = "claude-sonnet-4-6"
CLASSIFIER_MODEL = "claude-haiku-4-5-20251001"
# Route the /openai-responses proxy through Cloudflare AI Gateway so the call to
# OpenAI egresses from a supported region (fixes the 403
# "unsupported_country_region_territory" seen when a Worker calls OpenAI direct).
# The "default" gateway is auto-created on the first request. The worker appends
# "/responses" to this base.
OPENAI_BASE_URL = "https://gateway.ai.cloudflare.com/v1/1df6158c410d60cc3217209e4cc6ef47/default/openai"

# Accepted-advice event log (Cloudflare D1). The /events route stays disabled
# (returns 503) until this binding exists. To enable:
#   1) cd worker && npx wrangler d1 create wtv-events
#   2) paste the printed database_id below and uncomment this block
#   3) npx wrangler d1 migrations apply wtv-events --remote
#   4) npx wrangler deploy
# [[d1_databases]]
# binding = "DB"
# database_name = "wtv-events"
# database_id = "PASTE_DATABASE_ID_HERE"
# migrations_dir = "migrations"
